train:
  name: clean
  epochs: 100
  max_epochs: 100
  min_epochs: 20
  batch_size: 4
  grad_accum_steps: 2
  effective_batch_size: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stop_patience: 12
  pos_weight: 1.0
  pos_weight_mode: fixed
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 3
    min_lr: 1.0e-5
